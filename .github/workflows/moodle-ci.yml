name: Ally tool automated testing

# Runs tool_ally's own tests on every pull request, so a change is tested before
# it is approved. Until this workflow existed, tool_ally's tests only ran inside
# filter_ally's CI, which never runs for a tool_ally pull request.
#
# Values a person can type (branch names, commit messages, PR text) reach the
# scripts through env:, never as ${{ }} inside run:. Interpolated text is pasted
# into the script before bash parses it, so a quote or $( ) in it breaks or runs.

on:
  pull_request:
    branches: [master, 'MOODLE_*_STABLE']
  push:
    branches: [master, 'MOODLE_*_STABLE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PHP_VERSION: "8.3"
  # Moodle core for master. A MOODLE_<line>_STABLE branch tests on its own line.
  DEFAULT_MOODLE_BRANCH: "MOODLE_502_STABLE"

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_HOST_AUTH_METHOD: "trust"
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: "root"
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        database: [mariadb, pgsql]

    steps:
      - name: Choose Moodle core and the sibling plugin branches
        id: branches
        shell: bash
        env:
          # On a pull request: the PR branch and the branch it merges into.
          # On a push: both are the pushed branch.
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail

          # Moodle core follows the line this change is for.
          if [[ "$BASE_BRANCH" =~ ^MOODLE_[0-9]+_STABLE$ ]]; then
            moodle_branch="$BASE_BRANCH"
          else
            moodle_branch="$DEFAULT_MOODLE_BRANCH"
          fi

          # A sibling plugin comes from a branch with the same name as this one
          # (a change made in both repos), otherwise from the branch this change
          # merges into. master and every MOODLE_*_STABLE exist in all three repos.
          pick() {
            local repo=$1 candidate
            for candidate in "$HEAD_BRANCH" "$BASE_BRANCH"; do
              if git ls-remote --exit-code --heads \
                  "https://github.com/${GITHUB_REPOSITORY_OWNER}/${repo}.git" "refs/heads/${candidate}" >/dev/null 2>&1; then
                echo "$candidate"
                return 0
              fi
            done
            echo "::error::${repo} has no branch named ${HEAD_BRANCH} or ${BASE_BRANCH}" >&2
            return 1
          }
          filter_branch=$(pick moodle-filter_ally)
          report_branch=$(pick moodle-report_allylti)

          {
            echo "moodle_branch=$moodle_branch"
            echo "filter_branch=$filter_branch"
            echo "report_branch=$report_branch"
          } >> "$GITHUB_OUTPUT"

          # Say which code was tested, so nobody has to dig through the log for it.
          {
            echo "### Tested with"
            echo "| Component | Branch |"
            echo "| --- | --- |"
            echo "| Moodle core | \`$moodle_branch\` |"
            echo "| tool_ally | this ${GITHUB_EVENT_NAME//_/ } (\`$HEAD_BRANCH\`) |"
            echo "| filter_ally | \`$filter_branch\` |"
            echo "| report_allylti | \`$report_branch\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.DEFAULT_PHP_VERSION }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4.5
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8

      - name: Find the Open LMS plugins (hsuforum, snap)
        id: openlms
        shell: bash
        env:
          MOODLE_BRANCH: ${{ steps.branches.outputs.moodle_branch }}
        run: |
          set -euo pipefail

          # actions/checkout leaves an auth header that git reuses for every
          # github.com request, which breaks probes against other orgs.
          git config --global --unset-all http.https://github.com/.extraheader || true

          # tool_ally's hsuforum tests skip themselves when hsuforum is missing,
          # so install it where a branch exists, as filter_ally's CI does.
          citricity="${MOODLE_BRANCH/STABLE/CITRICITY}"
          find_branch() {
            local repo=$1 org branch
            for org in "$GITHUB_REPOSITORY_OWNER" open-lms-open-source; do
              for branch in "$citricity" "$MOODLE_BRANCH"; do
                if GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code --heads \
                    "https://github.com/${org}/${repo}.git" "refs/heads/${branch}" >/dev/null 2>&1 </dev/null; then
                  echo "https://github.com/${org}/${repo} ${branch}"
                  return 0
                fi
              done
            done
            echo ""
          }
          echo "hsuforum=$(find_branch moodle-mod_hsuforum)" >> "$GITHUB_OUTPUT"
          echo "snap=$(find_branch moodle-theme_snap)" >> "$GITHUB_OUTPUT"

      - name: Install Moodle with the Ally plugins
        id: install
        shell: bash
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ steps.branches.outputs.moodle_branch }}
          FILTER_BRANCH: ${{ steps.branches.outputs.filter_branch }}
          REPORT_BRANCH: ${{ steps.branches.outputs.report_branch }}
          HSUFORUM: ${{ steps.openlms.outputs.hsuforum }}
          SNAP: ${{ steps.openlms.outputs.snap }}
        run: |
          set -euo pipefail
          moodle-plugin-ci add-plugin --branch "$FILTER_BRANCH" --clone="https://github.com/${GITHUB_REPOSITORY_OWNER}/moodle-filter_ally"
          moodle-plugin-ci add-plugin --branch "$REPORT_BRANCH" --clone="https://github.com/${GITHUB_REPOSITORY_OWNER}/moodle-report_allylti"
          for found in "$HSUFORUM" "$SNAP"; do
            if [[ -n "$found" ]]; then
              read -r url branch <<< "$found"
              moodle-plugin-ci add-plugin --branch "$branch" --clone="$url"
            fi
          done
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      # Reported, not enforced yet: tool_ally has never been through these checks.
      # A problem shows as a warning naming the step, not as a red error on a green run.
      - name: Moodle Code Checker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          moodle-plugin-ci codechecker --max-warnings 0 \
            || echo "::warning::Code checker found problems (reported only, see this step's log)"

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          moodle-plugin-ci phpdoc \
            || echo "::warning::PHPDoc checker found problems (reported only, see this step's log)"

      - name: Validating
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci savepoints

      # The same command filter_ally's CI uses for tool_ally, so results compare.
      - name: Ally tool PHPUnit test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cd moodle
          composer config --unset repositories
          composer require --dev phpspec/prophecy
          vendor/bin/phpunit --testsuite=tool_ally_testsuite
